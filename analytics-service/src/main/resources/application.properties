# ===================================================================
# Analytics Service - application configuration
# ===================================================================

# --- Application ---------------------------------------------------
spring.application.name=analytics-service
server.port=4002

# --- Kafka consumer ------------------------------------------------
# Local:  localhost:9094 (default, Kafka's EXTERNAL listener)
# Docker: set KAFKA_BOOTSTRAP_SERVERS=kafka:9092
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

# Key = patient id (String), value = Protobuf PatientEvent (bytes)
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer

# A new consumer group starts from the oldest event still in the topic,
# instead of only events published after it starts.
spring.kafka.consumer.auto-offset-reset=earliest
