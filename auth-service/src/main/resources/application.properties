# ===================================================================
# Auth Service - application configuration
# -------------------------------------------------------------------
# Secrets (DB_PASSWORD, JWT_SECRET) are NEVER written in this file.
# Locally they come from auth-service/.env (git-ignored); in Docker or
# AWS they come from environment variables, which take priority.
# ===================================================================

# --- Application ---------------------------------------------------
spring.application.name=auth-service
server.port=4005

# --- Local secrets -------------------------------------------------
# Loads auth-service/.env if it exists (git-ignored, see .env.example).
spring.config.import=optional:file:.env[.properties]

# --- Datasource (auth-service-db, PostgreSQL) ----------------------
# Local:  localhost:5433 (default)
# Docker: DB_URL=jdbc:postgresql://auth-service-db:5432/auth_db
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/auth_db}
spring.datasource.username=${DB_USERNAME:auth_user}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate -----------------------------------------------
# update: create or alter tables to match the entities (development only)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Don't keep database sessions open while writing HTTP responses
spring.jpa.open-in-view=false

# --- Seed data -----------------------------------------------------
# Run data.sql (users table + test user) on PostgreSQL too.
# Spring Boot's default only runs it for embedded databases like H2.
spring.sql.init.mode=always

# --- JWT -----------------------------------------------------------
# Base64-encoded HMAC-SHA256 signing key (at least 256 bits / 32 bytes).
# Generate one with: openssl rand -base64 32
jwt.secret=${JWT_SECRET}
# How long an issued token stays valid (milliseconds): 10 hours
jwt.expiration-ms=${JWT_EXPIRATION_MS:36000000}
