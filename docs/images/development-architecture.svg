<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" width="1400" height="800" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>MediCore – Development Architecture</title>
  <defs>
    <marker id="a-rest" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <marker id="a-rpc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
    <marker id="a-evt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/></marker>
  </defs>
  <style>
    .title{fill:#f8fafc;font-size:26px;font-weight:700}
    .subtitle{fill:#94a3b8;font-size:14px}
    .zone{fill:#0f1a2e;stroke:#334155;stroke-width:1.5;stroke-dasharray:8 6}
    .zone-label{fill:#7dd3fc;font-size:16px;font-weight:600}
    .client{fill:#3b1820;stroke:#fb7185;stroke-width:1.5}
    .gateway{fill:#1e1b4b;stroke:#818cf8;stroke-width:1.5}
    .svc{fill:#0c2a3f;stroke:#38bdf8;stroke-width:1.5}
    .grpc{fill:#052e22;stroke:#34d399;stroke-width:1.5}
    .kafka{fill:#2a1d06;stroke:#fbbf24;stroke-width:1.5}
    .name{fill:#f1f5f9;font-size:16px;font-weight:600}
    .meta{fill:#94a3b8;font-size:12px}
    .bg-g{fill:#6ee7b7;font-size:12px;font-weight:600}
    .bg-k{fill:#fcd34d;font-size:12px;font-weight:600}
    .rest{fill:none;stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 5}
    .rpc{fill:none;stroke:#34d399;stroke-width:2;stroke-dasharray:7 5}
    .evt{fill:none;stroke:#fbbf24;stroke-width:3;stroke-dasharray:1 8;stroke-linecap:round}
    .msg{fill:#fbbf24}
    .legend{fill:#cbd5e1;font-size:13px}
  </style>

  <rect width="1400" height="800" rx="16" fill="#0b1220"/>
  <text x="40" y="52" class="title">Development Architecture</text>
  <text x="40" y="76" class="subtitle">Local development · every service runs as a container on one Docker network</text>

  <!-- Frontend -->
  <rect x="40" y="335" width="170" height="80" rx="12" class="client"/>
  <text x="125" y="370" text-anchor="middle" class="name">Frontend</text>
  <text x="125" y="390" text-anchor="middle" class="meta">(Client)</text>

  <!-- Docker network -->
  <rect x="250" y="90" width="1120" height="630" rx="18" class="zone"/>
  <text x="274" y="120" class="zone-label">🐳 Docker Network</text>

  <!-- API Gateway -->
  <rect x="290" y="335" width="150" height="80" rx="12" class="gateway"/>
  <text x="365" y="370" text-anchor="middle" class="name">API Gateway</text>
  <text x="365" y="390" text-anchor="middle" class="meta">Spring Cloud Gateway</text>

  <!-- Auth -->
  <rect x="520" y="130" width="200" height="80" rx="12" class="svc"/>
  <text x="620" y="165" text-anchor="middle" class="name">Auth Service</text>
  <text x="620" y="185" text-anchor="middle" class="meta">(micro-service)</text>

  <!-- proto file -->
  <path d="M772,128 h30 l14,14 v42 h-44 z" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5"/>
  <path d="M802,128 v14 h14" fill="none" stroke="#60a5fa" stroke-width="1.5"/>
  <path d="M786,150 l14,8 l-14,8 z" fill="#60a5fa"/>
  <text x="794" y="205" text-anchor="middle" class="meta">billing_service.proto</text>

  <!-- Billing -->
  <rect x="920" y="130" width="320" height="80" rx="12" class="svc"/>
  <rect x="928" y="138" width="92" height="64" rx="8" class="grpc"/>
  <text x="974" y="166" text-anchor="middle" class="bg-g">gRPC</text>
  <text x="974" y="182" text-anchor="middle" class="bg-g">Server</text>
  <text x="1130" y="165" text-anchor="middle" class="name">Billing Service</text>
  <text x="1130" y="185" text-anchor="middle" class="meta">(micro-service)</text>

  <!-- Patient -->
  <rect x="520" y="325" width="330" height="100" rx="12" class="svc"/>
  <text x="617" y="370" text-anchor="middle" class="name">Patient Service</text>
  <text x="617" y="390" text-anchor="middle" class="meta">(micro-service)</text>
  <rect x="720" y="333" width="120" height="40" rx="8" class="grpc"/>
  <text x="780" y="358" text-anchor="middle" class="bg-g">gRPC Client</text>
  <rect x="720" y="377" width="120" height="40" rx="8" class="kafka"/>
  <text x="780" y="402" text-anchor="middle" class="bg-k">Kafka Producer</text>

  <!-- Kafka topic -->
  <rect x="900" y="330" width="440" height="90" rx="12" class="kafka"/>
  <text x="1120" y="360" text-anchor="middle" class="name">Kafka Topic <tspan class="bg-k" font-size="14">(patients)</tspan></text>
  <g class="msg">
    <rect x="935" y="385" width="10" height="10" rx="2"/><rect x="965" y="385" width="10" height="10" rx="2"/>
    <rect x="995" y="385" width="10" height="10" rx="2"/><rect x="1025" y="385" width="10" height="10" rx="2"/>
    <rect x="1055" y="385" width="10" height="10" rx="2"/><rect x="1085" y="385" width="10" height="10" rx="2"/>
    <rect x="1115" y="385" width="10" height="10" rx="2"/><rect x="1145" y="385" width="10" height="10" rx="2"/>
    <rect x="1175" y="385" width="10" height="10" rx="2"/><rect x="1205" y="385" width="10" height="10" rx="2"/>
    <rect x="1235" y="385" width="10" height="10" rx="2"/><rect x="1265" y="385" width="10" height="10" rx="2"/>
    <rect x="1295" y="385" width="10" height="10" rx="2"/>
  </g>

  <!-- Analytics -->
  <rect x="820" y="520" width="250" height="130" rx="12" class="svc"/>
  <rect x="880" y="528" width="130" height="36" rx="8" class="kafka"/>
  <text x="945" y="551" text-anchor="middle" class="bg-k">Kafka Consumer</text>
  <text x="945" y="603" text-anchor="middle" class="name">Analytics Service</text>
  <text x="945" y="623" text-anchor="middle" class="meta">(micro-service)</text>

  <!-- Notification -->
  <rect x="1090" y="520" width="250" height="130" rx="12" class="svc"/>
  <rect x="1150" y="528" width="130" height="36" rx="8" class="kafka"/>
  <text x="1215" y="551" text-anchor="middle" class="bg-k">Kafka Consumer</text>
  <text x="1215" y="603" text-anchor="middle" class="name">Notification Service</text>
  <text x="1215" y="623" text-anchor="middle" class="meta">(micro-service)</text>

  <!-- Connections -->
  <path d="M210,375 H288" class="rest" marker-end="url(#a-rest)"/>
  <path d="M440,375 H518" class="rest" marker-end="url(#a-rest)"/>
  <path d="M365,335 V170 H518" class="rest" marker-end="url(#a-rest)"/>
  <path d="M365,415 V600 H818" class="rest" marker-end="url(#a-rest)"/>
  <path d="M840,353 H870 V170 H926" class="rpc" marker-end="url(#a-rpc)"/>
  <path d="M840,397 H896" class="evt" marker-end="url(#a-evt)"/>
  <path d="M945,420 V524" class="evt" marker-end="url(#a-evt)"/>
  <path d="M1215,420 V524" class="evt" marker-end="url(#a-evt)"/>

  <!-- Legend -->
  <g transform="translate(250,762)">
    <path d="M0,0 H40" class="rest"/><text x="50" y="5" class="legend">REST / HTTP</text>
    <path d="M170,0 H210" class="rpc"/><text x="220" y="5" class="legend">gRPC (synchronous)</text>
    <path d="M380,0 H420" class="evt"/><text x="430" y="5" class="legend">Kafka event (asynchronous)</text>
  </g>
</svg>
