syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.medicore.patient.events";

// Published to the "patient" Kafka topic by patient-service.
// Consumed by analytics-service and notification-service.
message PatientEvent {
  string patientId = 1;
  string name = 2;
  string email = 3;
  string eventType = 4;   // e.g. "PATIENT_CREATED"
}
