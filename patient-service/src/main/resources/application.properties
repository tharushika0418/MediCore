# ===================================================================
# Patient Service - application configuration
# -------------------------------------------------------------------
# The defaults below run the service locally against an in-memory H2
# database. In Docker or AWS, environment variables override them
# (Spring maps SPRING_DATASOURCE_URL -> spring.datasource.url, etc.),
# so no secrets ever need to be written in this file.
# ===================================================================

# --- Application ---------------------------------------------------
spring.application.name=patient-service
server.port=4000

# --- Local secrets -------------------------------------------------
# Loads patient-service/.env if it exists (git-ignored, see .env.example).
spring.config.import=optional:file:.env[.properties]

# --- Datasource ----------------------------------------------------
# Values come from .env or environment variables. Without them, the
# service falls back to in-memory H2 (the value after the colon).
spring.datasource.url=${DB_URL:jdbc:h2:mem:medicore}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:password}
# always = run data.sql on Postgres too (Spring's default only runs it for H2)
spring.sql.init.mode=${SQL_INIT_MODE:embedded}

# --- JPA / Hibernate -----------------------------------------------
# update: create or alter tables to match the entities (development only)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- H2 console (http://localhost:4000/h2-console) -----------------
# Requires the spring-boot-h2console dependency on Spring Boot 4.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- gRPC client: billing-service ----------------------------------
# Local:  localhost:9001 (default)
# Docker: set BILLING_SERVICE_ADDRESS=billing-service (the container name)
spring.grpc.client.channel.billing-service.target=static://${BILLING_SERVICE_ADDRESS:localhost}:${BILLING_SERVICE_GRPC_PORT:9001}

# --- PostgreSQL ----------------------------------------------------
# Local:      copy .env.example to .env and fill in the password.
# Docker/AWS: set DB_URL, DB_USERNAME, DB_PASSWORD, SQL_INIT_MODE as
#             environment variables (they take priority over .env).

logging.level.root=info
